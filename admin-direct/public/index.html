<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zuxriddin Academy — Direct Publish</title><style>*{box-sizing:border-box}body{font:16px system-ui,Arial;background:#f2f6fb;color:#15263d;margin:0}header{background:#102849;color:white;padding:24px;text-align:center}main{max-width:720px;margin:25px auto;padding:0 15px}section{background:white;border-radius:12px;border:1px solid #e0e8f0;padding:24px;margin-bottom:18px}input,select{width:100%;padding:12px;font:inherit;border-radius:8px;border:1px solid #c2cedc;margin:7px 0 12px}label{font-weight:650}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;font:inherit}#editor{display:none}#msg{min-height:20px}a{color:#2563eb}</style></head><body><header><h1>🎓 Zuxriddin Academy</h1><p>Admin — Direct Publish</p></header><main><section id="login"><h2>🔒 Admin Login</h2><form id="lf"><label for="pw">Admin parol</label><input id="pw" type="password" required autocomplete="current-password"><button>Kirish</button></form><p id="loginmsg" role="status"></p></section><section id="editor"><h2>🚀 Publish Test</h2><form id="pf"><label for="title">Test nomi</label><input id="title" required maxlength="130"><label for="subject">Bo‘lim</label><select id="subject"><option>reading</option><option>listening</option><option>speaking</option><option>grammar</option><option>vocabulary</option></select><label for="level">Daraja</label><select id="level"><option>a1</option><option selected>a2</option><option>b1</option><option>b2</option><option>c1</option><option>c2</option></select><label for="file">HTML test fayli (900 KB gacha)</label><input id="file" type="file" accept=".html,.htm,text/html" required><button id="publish">Publish Test</button></form><p id="msg" role="status"></p><p id="link"></p><button id="logout" type="button">Chiqish</button></section><section><p><a href="https://meliboyevz1991-web.github.io/zuxriddin-academy/" target="_blank" rel="noopener noreferrer">Zuxriddin Academy saytini ochish ↗</a></p></section></main><script>
const el=id=>document.getElementById(id);
async function api(path,options){let r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});let data=await r.json();if(!r.ok)throw Error(data.error||'Xatolik');return data}
function show(state){el('login').style.display=state?'none':'block';el('editor').style.display=state?'block':'none'}
api('session').then(x=>show(x.authenticated)).catch(()=>show(false));
el('lf').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',body:JSON.stringify({password:el('pw').value})});el('pw').value='';show(true)}catch(e){el('loginmsg').textContent=e.message}};
el('logout').onclick=async()=>{await api('logout',{method:'POST'});show(false)};
el('pf').onsubmit=async e=>{e.preventDefault();let f=el('file').files[0];if(!f||!/\.html?$/i.test(f.name)||f.size>900000){el('msg').textContent='900KB gacha HTML faylni tanlang';return}el('publish').disabled=true;el('msg').textContent='Yuborilmoqda...';el('link').textContent='';try{let o=await api('publish',{method:'POST',body:JSON.stringify({title:el('title').value,subject:el('subject').value,level:el('level').value,html:await f.text()})});el('msg').textContent='✅ GitHubga yuborildi: '+o.filename;let a=document.createElement('a');a.href=o.catalogUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Testlar bo‘limini ko‘rish ↗';el('link').append(a)}catch(e){el('msg').textContent=e.message}finally{el('publish').disabled=false}};
</script></body></html>
